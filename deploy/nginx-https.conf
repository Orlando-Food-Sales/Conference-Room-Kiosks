# Nginx for the room display WITH HTTPS (needed for "Sign in with Microsoft" on the dashboard; INSTALL-UBUNTU.md 12c).
# Replace ROOMS_HOSTNAME with the server's DNS name (for example rooms.orlandofoods.com) and point the two certificate
# lines at your certificate. Then: sudo cp deploy/nginx-https.conf /etc/nginx/sites-available/m365-room-display,
# sudo nginx -t, sudo systemctl reload nginx.
#
# The door tablets can keep their plain-HTTP addresses (http://<server-ip>/room/front?kiosk=1) and everything but the
# intercom, noise level and location keeps working. Those three need https: point each tablet at
# https://ROOMS_HOSTNAME/room/front?kiosk=1 (INSTALL-UBUNTU.md 12f). This file already proxies "/" on both ports, so no change is needed here.
# Only the dashboard and the sign-in pages move to HTTPS, because Microsoft only sends people back to https:// addresses.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Dashboard and sign-in: always over HTTPS, so the sign-in cookie (marked Secure) works.
    location = /dashboard  { return 301 https://ROOMS_HOSTNAME$request_uri; }
    location = /dashboard/ { return 301 https://ROOMS_HOSTNAME$request_uri; }
    location ^~ /auth/     { return 301 https://ROOMS_HOSTNAME$request_uri; }

    # Everything else (the tablets, the preview page, the API the tablets use) as before.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ROOMS_HOSTNAME;

    # Your company's certificate, Let's Encrypt (certbot with a DNS challenge), or the server's own authority made and
    # renewed by scripts/setup-local-https.sh (which also installs this file with the name filled in).
    ssl_certificate     /etc/ssl/room-display/fullchain.pem;
    ssl_certificate_key /etc/ssl/room-display/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:room_display:1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
